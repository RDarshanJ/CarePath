name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: carepath
          POSTGRES_PASSWORD: carepath
          POSTGRES_DB: carepath
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U carepath -d carepath"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://carepath:carepath@127.0.0.1:54329/carepath
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Migrate, seed, Playwright and axe stages are added by WP 2.3, 2.6 and 3.2.
